name: Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: InFabric-Jar
          path: build/libs/*.jar

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: InFabric-Jar
          path: build/libs

      - name: Determine Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count existing releases to auto-bump the build number
          RELEASE_COUNT=$(gh release list --limit 1000 --json tagName --jq 'length')
          BUILD_NUMBER=$((RELEASE_COUNT + 1))

          # Read base version from gradle.properties
          BASE_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)

          VERSION="${BASE_VERSION}-build.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        run: |
          # Get the commit title and body
          COMMIT_TITLE=$(git log -1 --pretty=format:'%s')
          COMMIT_BODY=$(git log -1 --pretty=format:'%b')

          # Build the release body with proper formatting
          {
            echo "body<<CHANGELOG_EOF"
            echo "## What's Changed"
            echo ""
            echo "**${COMMIT_TITLE}**"
            echo ""
            if [ -n "${COMMIT_BODY}" ]; then
              echo "${COMMIT_BODY}"
              echo ""
            fi
            echo "---"
            echo ""
            echo "### Build Info"
            echo "- **Version:** \`${{ steps.version.outputs.version }}\`"
            echo "- **Commit:** [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "InFabric v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          prerelease: true
          files: |
            build/libs/infabric-*.jar
            build/libs/infabric-*-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
